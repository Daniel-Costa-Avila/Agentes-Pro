<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentes Pro</title>
<meta name="description" content="Central de agentes e automações internas da Probel e Prodormir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* Paleta medida no banner institucional e no lockup Probel · Prodormir
   (marca/banner-institucional.jpg e marca/logo-lockup.jpg). Nenhum valor
   aqui foi escolhido por gosto: cada um sai de uma peça da marca. */
:root {
    --navy:         #105074;   /* wordmark Probel */
    --navy-escuro:  #0b3a57;
    --navy-fundo:   #eaf1f6;
    --ciano:        #30a8c8;   /* linhas da ilustração de nós */
    --ciano-esc:    #2288a4;
    --ciano-fundo:  #e6f4f8;
    --bronze:       #bca47c;   /* swoosh sob o Probel */
    --bronze-esc:   #a07d3c;
    --bronze-txt:   #8a6a2f;
    --bronze-fundo: #f6f1e7;
    --vinho:        #800808;   /* "dormir" do Prodormir */

    --tinta:        #1f2a33;
    --texto:        #566573;
    --texto-2:      #6b7885;
    --apoio:        #66737f;
    --fraco:        #9aa6b2;
    --linha:        #dce4ec;
    --linha-forte:  #ccd8e2;
    --bg-page:      #f0f4f8;
    --sub:          #f7f9fb;
    --white:        #ffffff;

    --card-pad:     20px;
    --grid-gap:     20px;
}

body {
    font-family: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg-page);
    color: var(--texto);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

a { color: var(--navy); text-decoration: none; }
a:hover { color: var(--navy-escuro); }

:focus-visible { outline: 2px solid var(--ciano-esc); outline-offset: 3px; border-radius: 4px; }

.container { max-width: 1120px; margin: 0 auto; padding: 0 2.25rem; }

.sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

/* rótulo em versalete — usado em categoria, selo de seção e meta */
.rotulo, .cat, .count, .guia-etiqueta, .pg-eyebrow, .eyebrow {
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.09em;
    text-transform: uppercase; color: var(--apoio);
}

/* ─── TOPBAR ──────────────────────────────────────── */
.topbar { background: var(--white); border-bottom: 1px solid var(--linha); }
.topbar-in {
    max-width: 1120px; margin: 0 auto; padding: 0 2.25rem; height: 68px;
    display: flex; align-items: center; gap: 32px;
}
.wordmark { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
/* o JPEG do logo tem fundo quase branco; multiply o dissolve sobre a barra */
.wordmark-logo { height: 30px; width: auto; display: block; mix-blend-mode: multiply; }
.wordmark-risco { width: 1px; height: 26px; background: var(--linha); flex-shrink: 0; }
.wordmark-txt { font-size: 17px; font-weight: 700; color: var(--navy); letter-spacing: -0.005em; white-space: nowrap; }
.top-link {
    font-size: 14px; font-weight: 400; color: var(--texto); display: flex; align-items: center; gap: 8px;
    background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer; flex-shrink: 0;
}
.top-link:hover { color: var(--navy); }

/* menu das páginas criadas no painel */
.menu { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; }
.menu-link {
    font-size: 14.5px; font-weight: 400; color: var(--texto);
    padding: 8px 13px; border-radius: 5px; white-space: nowrap;
    transition: background 0.16s, color 0.16s;
}
.menu-link:hover { background: var(--sub); color: var(--navy); }
.menu-link.on { color: var(--navy); font-weight: 600; background: var(--navy-fundo); }

/* ─── FAIXA INSTITUCIONAL ─────────────────────────── */
/* peça do Marketing, usada como está: ela já diz o que o portal é */
.faixa-marca { background: var(--white); border-bottom: 1px solid var(--linha); }
.faixa-marca img { display: block; width: 100%; height: auto; }

/* ─── HERO (busca e filtros) ──────────────────────── */
.hero { background: var(--white); border-bottom: 1px solid var(--linha); padding: 30px 0 28px; }
.hero-in { position: relative; }
.eyebrow { margin-bottom: 10px; }
.hero h1 {
    font-size: clamp(22px, 2.6vw, 27px); font-weight: 700; color: var(--tinta);
    letter-spacing: -0.015em; line-height: 1.2; margin-bottom: 8px;
}
.lede {
    font-size: 16px; font-weight: 400; line-height: 1.6;
    color: var(--texto); max-width: 50em; margin-bottom: 22px; text-wrap: pretty;
}

/* busca */
.search {
    display: flex; align-items: center; gap: 11px; max-width: 470px;
    background: var(--sub); border: 1px solid var(--linha-forte);
    border-radius: 5px; height: 46px; padding: 0 15px; margin-bottom: 16px;
}
.search:focus-within { border-color: var(--ciano-esc); box-shadow: 0 0 0 3px rgba(48,168,200,0.14); }
.search > svg { color: var(--apoio); flex-shrink: 0; }
.search input {
    border: 0; outline: 0; background: transparent; flex: 1; min-width: 0;
    font-family: inherit; font-size: 15px; color: var(--tinta); line-height: 1.4;
}
.search input::placeholder { color: var(--fraco); }
.btn-clear {
    border: 0; background: #e4ebf2; color: var(--apoio); cursor: pointer; padding: 0;
    width: 22px; height: 22px; border-radius: 20px; flex-shrink: 0;
    display: none; align-items: center; justify-content: center;
}
.btn-clear.is-visible { display: flex; }
.btn-clear:hover { background: var(--linha-forte); color: var(--texto); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
    font-family: inherit; font-size: 13.5px; font-weight: 400;
    height: 34px; padding: 0 14px; border-radius: 17px; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 7px;
    background: var(--white); color: var(--texto); border: 1px solid var(--linha-forte);
    transition: background 0.16s, color 0.16s, border-color 0.16s;
}
.chip:hover { border-color: var(--navy); color: var(--navy); }
.chip.is-on {
    background: var(--navy); color: var(--white); font-weight: 600; border-color: var(--navy);
}
.chip-n { font-size: 13px; font-weight: 400; color: var(--apoio); }
.chip.is-on .chip-n { color: rgba(255,255,255,0.68); }

/* ─── CONTEÚDO ────────────────────────────────────── */
.main { padding: 32px 0 52px; }
.resultbar { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
.count b { color: var(--tinta); font-weight: 700; }
.link-soft {
    font-size: 14px; font-weight: 600; color: var(--navy); display: flex; align-items: center; gap: 7px;
    background: none; border: 0; padding: 0; font-family: inherit; cursor: pointer;
}
.link-soft:hover { color: var(--navy-escuro); }

/* ─── DESTAQUES ───────────────────────────────────── */
.destaques { margin-bottom: var(--grid-gap); }
.destaques .featured { margin-bottom: 0; }
.destaques-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--grid-gap); }
.destaques-3 { display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--grid-gap); align-items: stretch; }
.destaques-3 .destaques-lado { display: grid; grid-template-rows: 1fr 1fr; gap: var(--grid-gap); }

.featured {
    display: grid; grid-template-columns: 268px 1fr; gap: 32px; align-items: center;
    background: var(--white); border: 1px solid var(--linha); border-radius: 6px;
    padding: 26px; margin-bottom: var(--grid-gap);
}
.feat-thumb {
    aspect-ratio: 4 / 3; border-radius: 4px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #e4ebf2;
}
.feat-thumb img { display: block; width: 84%; height: 78%; object-fit: contain; }
.feat-body h3 { font-size: 26px; font-weight: 700; color: var(--tinta); line-height: 1.2; letter-spacing: -0.015em; margin: 9px 0; }
.feat-body p { font-size: 15.5px; line-height: 1.65; color: var(--texto); max-width: 44em; margin-bottom: 20px; text-wrap: pretty; }
.feat-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.feat-url { font-size: 14px; color: var(--apoio); }

.feat-meio { grid-template-columns: 1fr; gap: 18px; align-items: start; }
.feat-meio .feat-thumb { width: 100%; aspect-ratio: 16 / 8; }
.feat-meio .feat-body h3 { font-size: 21px; }
.feat-meio .feat-body p { font-size: 14.5px; margin-bottom: 16px; }

.feat-principal { height: 100%; grid-template-columns: 1fr; align-content: start; gap: 20px; }
.feat-principal .feat-thumb { aspect-ratio: 16 / 8; }

.feat-curto { grid-template-columns: 1fr; gap: 12px; align-items: start; padding: 18px; }
.feat-curto .feat-thumb { display: none; }
.feat-curto .feat-body h3 { font-size: 18px; margin: 6px 0; }
.feat-curto .feat-body p {
    font-size: 14px; line-height: 1.55; margin-bottom: 14px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}

/* ─── GRADE + CARDS ───────────────────────────────── */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: var(--grid-gap); }
.card {
    display: flex; flex-direction: column;
    background: var(--white); border: 1px solid var(--linha); border-radius: 6px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover {
    border-color: var(--linha-forte);
    box-shadow: 0 4px 14px rgba(16,80,116,0.08);
}
.thumb {
    aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--linha); overflow: hidden;
}
.thumb img { display: block; width: 78%; height: 74%; object-fit: contain; }
.thumb svg { max-width: 82%; max-height: 82%; }

/* fundos de miniatura herdados do cadastro antigo dos recursos */
.bg-preco  { background: linear-gradient(135deg, #1a1a2e, #16213e); }
.bg-white  { background: var(--white); }
.bg-trilha { background: linear-gradient(135deg, #0f3460, #16213e); }
.bg-radar  { background: linear-gradient(160deg, #060d24, #0a1940); }
.bg-prof   { background: linear-gradient(160deg, #0d1b2a, #1b2838); }
.bg-design { background: linear-gradient(160deg, #1a0a00, #2d1500); }

.cbody { padding: var(--card-pad); display: flex; flex-direction: column; flex: 1; }
.cmeta { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; min-height: 22px; }
.cat { display: flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; border-radius: 20px; flex-shrink: 0; }
.dot-op { background: var(--navy); }
.dot-ia { background: var(--ciano); }
.dot-fer { background: var(--bronze); }
.pill {
    display: inline-flex; align-items: center; height: 23px; padding: 0 10px; border-radius: 12px;
    background: var(--bronze-fundo); color: var(--bronze-txt);
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; white-space: nowrap;
}
.card h3 { font-size: 18.5px; font-weight: 700; color: var(--tinta); line-height: 1.25; letter-spacing: -0.01em; margin-bottom: 8px; }
.card p { font-size: 14px; line-height: 1.6; color: var(--texto-2); flex: 1; margin-bottom: 18px; text-wrap: pretty; }

/* ─── BOTÕES ──────────────────────────────────────── */
.btn {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    height: 42px; border-radius: 5px; border: 1px solid var(--linha-forte); cursor: pointer;
    background: var(--white); color: var(--navy);
    font-family: inherit; font-size: 14px; font-weight: 600;
    transition: background 0.18s, border-color 0.18s, color 0.18s;
}
.btn:hover { background: var(--navy-fundo); border-color: var(--navy); color: var(--navy-escuro); }
/* na faixa de destaque e nas páginas o botão é o cheio */
.btn-wide {
    width: auto; padding: 0 24px;
    background: var(--navy); color: var(--white); border-color: var(--navy);
}
.btn-wide:hover { background: var(--navy-escuro); border-color: var(--navy-escuro); color: var(--white); }
.btn-off {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    height: 42px; border-radius: 5px; background: #eef1f5; color: var(--fraco);
    font-family: inherit; font-size: 14px; font-weight: 600; cursor: not-allowed;
}

.link-saiba-mais {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    margin-top: 10px; font-size: 14px; font-weight: 400; color: var(--texto);
    text-decoration: underline; text-decoration-color: var(--linha-forte); text-underline-offset: 3px;
}
.link-saiba-mais:hover { color: var(--navy); text-decoration-color: var(--navy); }
.feat-actions .link-saiba-mais { margin-top: 0; }

/* ─── VAZIO + AVISO ───────────────────────────────── */
.empty {
    display: none; text-align: center; padding: 56px 24px; background: var(--white);
    border: 1px dashed var(--linha-forte); border-radius: 6px; color: var(--texto-2);
}
.empty.is-visible { display: block; }
.empty h4 { font-size: 17px; font-weight: 700; color: var(--tinta); margin: 14px 0 6px; }
.empty p { font-size: 14px; }

.footnote {
    display: flex; align-items: flex-start; gap: 12px; margin-top: 24px; padding: 15px 18px;
    background: var(--bronze-fundo); border: 1px solid #ece0c9; border-radius: 6px;
    font-size: 14px; line-height: 1.62; color: #6b6250;
}
.footnote b, .footnote strong { color: var(--bronze-txt); font-weight: 700; }
.footnote svg { flex-shrink: 0; margin-top: 1px; }

/* ─── GUIAS E MATERIAIS ───────────────────────────── */
.guias { margin-top: 48px; padding-top: 30px; border-top: 1px solid var(--linha); }
.guias-h2 { font-size: 21px; font-weight: 700; color: var(--tinta); letter-spacing: -0.012em; margin-bottom: 6px; }
.guias-lede { font-size: 14.5px; line-height: 1.6; color: var(--texto-2); margin-bottom: 20px; }
.guias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.guia-card {
    display: flex; align-items: center; gap: 13px; padding: 17px;
    background: var(--white); border: 1px solid var(--linha); border-radius: 6px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.guia-card:hover { border-color: var(--linha-forte); box-shadow: 0 4px 14px rgba(16,80,116,0.08); }
.guia-icone {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    background: var(--navy-fundo); color: var(--navy);
}
.guia-corpo { flex: 1; min-width: 0; }
.guia-tit {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 15px; font-weight: 600; color: var(--tinta); line-height: 1.3;
}
.guia-etiqueta { color: var(--bronze-esc); }
.guia-corpo p {
    font-size: 13px; line-height: 1.5; color: var(--apoio); margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.guia-seta { flex-shrink: 0; color: #b9c9d8; }
.guia-card:hover .guia-seta { color: var(--navy); }

/* ─── FOOTER ──────────────────────────────────────── */
footer { background: var(--white); border-top: 1px solid var(--linha); padding: 28px 0; }
.footer-in {
    max-width: 1120px; margin: 0 auto; padding: 0 2.25rem;
    display: flex; align-items: center; justify-content: space-between; gap: 32px;
}
.footer-in p { font-size: 14px; color: var(--texto-2); }
.footer-in a { text-decoration: underline; text-decoration-color: var(--linha-forte); text-underline-offset: 3px; }
.footer-logo { height: 34px; width: auto; display: block; mix-blend-mode: multiply; }

/* ─── ESTADO ──────────────────────────────────────── */
.is-hidden { display: none !important; }

/* ─── PÁGINAS CRIADAS NO PAINEL ───────────────────── */
.pg-main { padding-top: 30px; padding-bottom: 60px; max-width: 800px; }
.pg-voltar {
    display: inline-flex; align-items: center; gap: 7px; font-size: 14px;
    color: var(--texto-2); margin-bottom: 26px;
}
.pg-voltar:hover { color: var(--navy); }
.pg-eyebrow { margin-bottom: 10px; }
.pg-h1 { font-size: clamp(27px, 4vw, 38px); font-weight: 700; color: var(--tinta); line-height: 1.14; letter-spacing: -0.022em; margin-bottom: 12px; }
.pg-resumo { font-size: 18px; line-height: 1.6; color: var(--texto); margin-bottom: 20px; text-wrap: pretty; }
.pg-corpo { display: flex; flex-direction: column; gap: 22px; padding-top: 22px; border-top: 1px solid var(--linha); }
.pg-h2 { font-size: 24px; font-weight: 700; color: var(--tinta); line-height: 1.25; letter-spacing: -0.015em; margin-top: 14px; }
.pg-corpo p { font-size: 16.5px; line-height: 1.75; color: #4a5865; text-wrap: pretty; }
.pg-figure { margin: 0; }
.pg-figure img { display: block; width: 100%; border-radius: 6px; border: 1px solid var(--linha); }
.pg-figure figcaption { font-size: 13px; color: var(--apoio); margin-top: 8px; text-align: center; }
.video-caixa { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #000; }
.video-caixa iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.pg-cta { margin-top: 36px; padding-top: 26px; border-top: 1px solid var(--linha); display: flex; justify-content: center; }

/* blocos novos do editor de páginas */
.pg-aviso {
    display: flex; align-items: flex-start; gap: 12px;
    border-radius: 6px; padding: 15px 18px; border: 1px solid;
}
.pg-aviso svg { flex-shrink: 0; margin-top: 1px; }
.pg-aviso p { font-size: 14.5px; line-height: 1.6; margin: 0; }
.aviso-info { background: var(--navy-fundo); border-color: #cfe0ec; color: #3f5261; }
.aviso-atencao { background: var(--bronze-fundo); border-color: #ece0c9; color: #6b6250; }
.aviso-ok { background: var(--ciano-fundo); border-color: #cfe8f0; color: #3d5a63; }

.pg-passos {
    background: var(--white); border: 1px solid var(--linha); border-radius: 6px; padding: 22px 24px;
}
.pg-passos-h { font-size: 17px; font-weight: 700; color: var(--tinta); margin-bottom: 16px; }
.pg-passos ol { list-style: none; display: flex; flex-direction: column; gap: 13px; }
.pg-passos li {
    position: relative; padding-left: 40px;
    font-size: 15px; line-height: 1.68; color: #4a5865;
    counter-increment: passo;
}
.pg-passos ol { counter-reset: passo; }
.pg-passos li::before {
    content: counter(passo); position: absolute; left: 0; top: 0;
    width: 26px; height: 26px; border-radius: 13px;
    background: var(--navy); color: var(--white);
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
}

.pg-botao { display: flex; padding: 4px 0; }
.pg-botao-esquerda { justify-content: flex-start; }
.pg-botao-centro { justify-content: center; }
.pg-botao-direita { justify-content: flex-end; }
.pg-botao .btn {
    width: auto; padding: 0 24px; height: 44px; font-size: 14.5px;
    background: var(--navy); color: var(--white); border-color: var(--navy);
}
.pg-botao .btn:hover { background: var(--navy-escuro); border-color: var(--navy-escuro); color: var(--white); }
.pg-botao .btn-sec {
    background: var(--white); color: var(--navy); border-color: var(--linha-forte);
}
.pg-botao .btn-sec:hover { background: var(--navy-fundo); border-color: var(--navy); color: var(--navy-escuro); }

.pg-cards-h { font-size: 17px; font-weight: 700; color: var(--tinta); margin-bottom: 12px; }
.pg-cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pg-card {
    display: flex; align-items: center; gap: 12px; padding: 15px;
    background: var(--white); border: 1px solid var(--linha); border-radius: 6px;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.pg-card:hover { border-color: var(--linha-forte); box-shadow: 0 4px 14px rgba(16,80,116,0.08); }
.pg-card-ic {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    background: var(--ciano-fundo); color: var(--ciano-esc);
}
.pg-card-corpo { min-width: 0; }
.pg-card-tit { display: block; font-size: 15px; font-weight: 600; color: var(--tinta); line-height: 1.3; }
.pg-card-txt { display: block; font-size: 13px; line-height: 1.5; color: var(--apoio); margin-top: 2px; }

/* ─── MODAL DE CONTATO ──────────────────────────────── */
.modal-cortina {
    display: none; position: fixed; inset: 0; z-index: 100; background: rgba(16,80,116,0.42);
    align-items: center; justify-content: center; padding: 20px;
}
.modal-cortina.is-aberta { display: flex; }
.modal-caixa {
    position: relative; width: 100%; max-width: 440px; background: var(--white);
    border-radius: 8px; padding: 30px 28px 26px; box-shadow: 0 20px 60px rgba(11,58,87,0.28);
    max-height: 90vh; overflow-y: auto;
}
.modal-fechar {
    position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 6px;
    border: 0; background: transparent; color: var(--apoio); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.modal-fechar:hover { background: var(--sub); color: var(--texto); }
.modal-caixa h3 { font-size: 19px; font-weight: 700; color: var(--tinta); margin-bottom: 6px; }
.modal-sub { font-size: 14px; line-height: 1.55; color: var(--texto-2); margin-bottom: 20px; }
.campo-modal { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.campo-modal label { font-size: 13px; font-weight: 600; color: var(--texto); }
.campo-modal input, .campo-modal textarea {
    border: 1px solid var(--linha-forte); border-radius: 5px; padding: 10px 12px;
    font-family: inherit; font-size: 14.5px; color: var(--tinta); outline: 0; resize: vertical;
}
.campo-modal input:focus, .campo-modal textarea:focus {
    border-color: var(--ciano-esc); box-shadow: 0 0 0 3px rgba(48,168,200,0.14);
}
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.modal-erro {
    display: none; font-size: 13.5px; color: var(--vinho); background: #fbf2f2; border: 1px solid #e8cccc;
    border-radius: 5px; padding: 9px 12px; margin-bottom: 14px;
}
.modal-erro.is-visible { display: block; }
#contato-form.is-hidden { display: none; }
.modal-sucesso {
    display: none; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    padding: 10px 0; color: var(--texto); font-size: 14.5px; line-height: 1.55;
}
.modal-sucesso.is-visible { display: flex; }
.modal-sucesso svg { color: var(--ciano-esc); }

/* ─── RESPONSIVO ──────────────────────────────────── */
